spring.application.name=cart-service
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cart_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:user-service}

product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
product.service.connect-timeout-ms=${PRODUCT_CONNECT_TIMEOUT_MS:2000}
product.service.read-timeout-ms=${PRODUCT_READ_TIMEOUT_MS:3000}

FRONTEND_ORIGIN=${FRONTEND_ORIGIN:}

management.endpoints.web.exposure.include=health,info
