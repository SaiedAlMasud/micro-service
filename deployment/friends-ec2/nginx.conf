server {
    listen 80;
    server_name _;

    location = /api/v1/products {
        proxy_pass http://product-service:8082;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/products/ {
        proxy_pass http://product-service:8082;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/categories {
        proxy_pass http://product-service:8082;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/categories/ {
        proxy_pass http://product-service:8082;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/cart/ {
        proxy_pass http://cart-service:8083;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/cart {
        proxy_pass http://cart-service:8083;
        include /etc/nginx/proxy_params;
    }
}
