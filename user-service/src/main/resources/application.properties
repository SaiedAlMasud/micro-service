## ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=user-service
spring.config.import=optional:file:.env[.properties]
FRONTEND_ORIGIN=${FRONTEND_ORIGIN:http://localhost:5173}
server.port=${SERVER_PORT:8081}

## ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USER:user_svc}
spring.datasource.password=${DB_PASSWORD:secret}

## ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

## ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

## ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:change-me-in-production-must-be-32-chars-min}
jwt.access-token-expiry-seconds=${JWT_ACCESS_EXPIRY:3600}
jwt.refresh-token-expiry-seconds=${JWT_REFRESH_EXPIRY:604800}

## ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

## ─── Springdoc / Swagger ──────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
